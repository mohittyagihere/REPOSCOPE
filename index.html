<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111418" />
    <meta name="description" content="Explore public GitHub profiles, repositories, source files, documentation, and activity in RepoScope." />
    <title>RepoScope — GitHub Explorer</title>
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem("reposcope-theme"));
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
